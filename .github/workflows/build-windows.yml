name: Windows Build

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Build Patch
        shell: python
        run: |
          import os

          def patch(filename, old, new):
              path = os.path.join('cmake', filename)
              if not os.path.exists(path):
                  print(f"Error: {path} not found")
                  return
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              if old not in content:
                  print(f"Warning: '{old}' not found in {path}")
                  return
              with open(path, 'w', encoding='utf-8', newline='\n') as f:
                  f.write(content.replace(old, new))
              print(f"Successfully patched {path}")

          # Patch options_win.cmake
          patch('options_win.cmake', 
                '/MP     # Enable multi process build.', 
                '/MP     # Enable multi process build.\n        /FS')
          patch('options_win.cmake',
                '$<$<NOT:$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>>:$<IF:$<STREQUAL:$<GENEX_EVAL:$<TARGET_PROPERTY:MSVC_DEBUG_INFORMATION_FORMAT>>,ProgramDatabase>,/DEBUG,/DEBUG:NONE>>',
                '$<$<NOT:$<AND:$<CONFIG:Debug>,$<BOOL:${build_win64}>>>:$<IF:$<BOOL:$<GENEX_EVAL:$<TARGET_PROPERTY:MSVC_DEBUG_INFORMATION_FORMAT>>>,/DEBUG,/DEBUG:NONE>>')

          # Patch variables.cmake
          patch('variables.cmake',
                'set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT "ProgramDatabase" CACHE STRING "")',
                'set(CMAKE_MSVC_DEBUG_INFORMATION_FORMAT\n    "$<$<CONFIG:Debug,RelWithDebInfo>:ProgramDatabase>$<$<CONFIG:Release,MinSizeRel>:Embedded>"\n    CACHE STRING "" FORCE)')

      - name: Free Disk Space
        shell: pwsh
        run: |
          $paths = @(
              "C:\Program Files\Android",
              "C:\hostedtoolcache\windows\dotnet",
              "C:\Program Files\dotnet",
              "C:\usr\share\dotnet"
          )
          foreach ($path in $paths) {
              if (Test-Path $path) {
                  Write-Host "Removing $path"
                  Remove-Item -Path $path -Recurse -Force -ErrorAction SilentlyContinue
              }
          }
          Write-Host "Disk space after cleanup:"
          Get-PSDrive C | Select-Object Free

      - name: Configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"
        continue-on-error: true

      - name: Verify Pagefile
        shell: pwsh
        run: |
          Get-CimInstance Win32_PageFileSetting | Select-Object Name, InitialSize, MaximumSize

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.os }}-build-deps-${{ hashFiles('Telegram/build/prepare/prepare.py', '.gitmodules') }}-skip-debug
          restore-keys: |
            ${{ runner.os }}-build-deps-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare Dependencies
        shell: cmd
        run: |
          mkdir Libraries
          mkdir ThirdParty
          call Telegram\build\prepare\win.bat skip-debug

      - name: Configure
        shell: cmd
        run: |
          call Telegram\configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build
        shell: cmd
        run: |
          cmake --build out --config Release --target Telegram

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64
          path: out/Release/AyuGram.exe
